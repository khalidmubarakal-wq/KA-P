function inviteClientCoord(form, cid){ const n = form.uname.value.trim(), e = form.uemail.value.trim(), errs = {};
  if (n.length<3) errs.uname = t('errName'); if (!validEmail(e)) errs.uemail = t('errEmail'); else if (S.users.some(u=>u.email.toLowerCase()===e.toLowerCase())) errs.uemail = t('errDupEmail'); if (!formErrors(form, errs)) return;

function parseCsv(text){ const rows = []; let row = [], cur = '', q = false;
  for (let i=0;i<text.length;i++){ const ch = text[i];
    if (q){ if (ch==='"' && text[i+1]==='"'){ cur += '"'; i++; } else if (ch==='"') q = false; else cur += ch; }
    else if (ch==='"') q = true; else if (ch===',' || ch===';' || ch==='\t'){ row.push(cur.trim()); cur = ''; } else if (ch==='\n' || ch==='\r'){ if (ch==='\r' && text[i+1]==='\n') i++; row.push(cur.trim()); if (row.some(x=>x)) rows.push(row); row = []; cur = ''; } else cur += ch; }
  row.push(cur.trim()); if (row.some(x=>x)) rows.push(row); return rows; }
function validateImport(rows){
  const c = course(IMPORT.cid); if (!rows.length) return $('#e-icsv').textContent = t('fileEmpty');
  const hdr = rows[0].map(h=>String(h).toLowerCase().trim()), find = k => hdr.findIndex(h=>HDR[k].includes(h));

  if (ix.name<0 || ix.email<0) return $('#e-icsv').textContent = t('errHeader2');
  const enrolled = new Set(courseParticipants(c.id).map(x=>x.email.toLowerCase())), seen = new Set();
  const out = rows.slice(1).map((r,i)=>{ const o = {n:i+2, name:(r[ix.name]||'').trim(), email:(r[ix.email]||'').trim(), dept: ix.dept>=0?(r[ix.dept]||'').trim():'', emp: ix.emp>=0?String(r[ix.emp]||'').trim():''}, e = [], k = o.email.toLowerCase();
    if (!o.name) e.push('noName'); if (!validEmail(o.email)) e.push('badEmail'); else if (seen.has(k)) e.push('dupFile'); else if (enrolled.has(k)) e.push('exists'); seen.add(k); o.errors = e; return o; });
  IMPORT.rows = out; const ok = out.filter(r=>!r.errors.length).length, cnt = k => out.filter(r=>r.errors.includes(k)).length;
  $('#import-preview').innerHTML = `<div class="row" style="margin-bottom:8px">${badge('b-ok', t('imp.valid',{n:ok}))}${badge(out.length-ok?'b-bad':'', t('imp.invalid',{n:out.length-ok}))}<span class="xs muted">${['noName','badEmail','dupFile','exists'].filter(k=>cnt(k)).map(k=>`${t('imp2.'+k)}: ${cnt(k)}`).join(' · ')}</span></div>

  const b = $('#importGo'); if (b){ b.disabled = !ok; b.textContent = t('importNInto',{n:ok, c:L(c.title)}); }
}

  if (u.role==='trainer'){ const cs = S.courses.filter(c=>!c.archived && isCourseInstructor(c.id, u.id)); return {txt: cs.length ? cs.map(c=>L(c.title)).join(' · ') : t('scope.noCourse'), items:cs.map(c=>({label:L(c.title) + (leadOf(c.id)===u.id && courseInstructors(c.id).length>1 ? ' · '+t('leadShort',null,true) : ''), sub:`${L(program(c.programId).title)} · ${t('nSessionsAssigned',{n:S.sessions.filter(s=>s.courseId===c.id && s.status!=='cancelled' && sessionInstructors(s).includes(u.id)).length},true)}`, href:href('course',c.id)}))}; }

function openInvite(r, ctx={}){
  INVITE_CTX = Object.assign({role:r}, ctx);
  const progs = S.programs.filter(p=>!p.archived).sort((a,b)=>L(a.title).localeCompare(L(b.title), LANG)), crs = S.courses.filter(c=>!c.archived && program(c.programId) && !program(c.programId).archived);

function participantProgress(paid){
  const p = part(paid), ch = cohort(p.cohortId), c = course(ch.courseId), a = attStats(paid), acts = activitiesFor(ch.id, true), st = S.settings;
  const actsDone = acts.filter(x=>subDone(subState(x, paid))).length, overdue = acts.filter(x=>subState(x, paid)==='overdue').length;
  const pre = !!getAttempt(paid, c.id, 'pre'), post = !!getAttempt(paid, c.id, 'post'), fin = evalsOf(ch.id, paid).some(e=>e.kind==='final');
  const req = [pre, post].concat(st.requireFinal ? [fin] : []), ci = certInfo(paid), run = cohortRun(ch.id);
  const group = ci.status==='approved' || (run==='completed' && ci.eligible) ? 'completed' : run==='not_started' || run==='none' ? 'not_started' : (run==='completed' || overdue || (a.pct!=null && a.pct < st.minAttendance)) ? 'attention' : 'on_track';
  return {p, a, acts:acts.length, actsDone, overdue, pre, post, fin, reqDone:req.filter(Boolean).length, reqTotal:req.length, ci, group};
}
function courseProgress(cid){

  let present = 0; es.forEach(s=>{ const k = sessCounts(s.id); present += k.present + k.late; });
  const expected = es.length * ps.length, per = ps.map(x=>participantProgress(x.id)), groups = {completed:0, on_track:0, attention:0, not_started:0}; per.forEach(x=>groups[x.group]++);
  return {ch, ds, ss, es, ps, daysDone, present, expected, attPct: expected ? present/expected*100 : null, per, groups,
    reqDone: per.reduce((a,x)=>a+x.reqDone,0), reqTotal: per.reduce((a,x)=>a+x.reqTotal,0), actDone: per.reduce((a,x)=>a+x.actsDone,0), actTotal: per.reduce((a,x)=>a+x.acts,0), certs: per.filter(x=>x.ci.status==='approved').length};
}

function shuffleArr(a){ const x = a.slice(); for (let i=x.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [x[i],x[j]] = [x[j],x[i]]; } return x; }

  if (!at){ at = {id:uid('at'), assessmentId:a.id, courseId:a.courseId, cohortId:ch.id, participantId:paid, type:a.type, items:{}, score:0, max:0, started:Date.now(), completed:null}; S.attempts.push(at); save(); }

ACT.startQuiz = el => { const a = byId(S.activities, el.dataset.aid), paid = myPid(a.courseId); if (S.submissions[a.id+':'+paid]) return toast(t('alreadySubmitted'),'warn');

const fmtSecs = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function runnerBody(){

function comparisonHtml(c, pre, post){

function checkinResult(res, s){
  const r = res.rec;
  const RES = {present:['r-ok','checkCircle', t('ci.okTitle'), t('ci.okMsg')], late:['r-late','clock', t('ci.lateTitle'), t('ci.lateMsg',{w:S.settings.checkinWindow})],
    already:['r-dup','checkCircle', t('ci.alreadyTitle'), t('ci.alreadyMsg')], duplicate:['r-dup','info', t('ci.dupTitle'), t('ci.dupMsg')],
    other_session:['r-bad','ban', t('ci.rejTitle'), t('rj.other_session')], regenerated:['r-bad','ban', t('ci.rejTitle'), t('rj.regenerated')], invalid:['r-bad','ban', t('ci.rejTitle'), t('rj.invalid_code')], closed:['r-bad','ban', t('ci.closedTitle'), t('ci.closedMsg')]}[res.res];
  const okish = ['present','late','already','duplicate'].includes(res.res);
  return `<div class="result ${RES[0]}" role="status"><div class="ring">${icon(RES[1],38)}</div><h2>${RES[2]}</h2><p class="small muted" style="margin-top:4px">${RES[3]}</p></div>
  ${okish && r ? `<div style="margin-top:14px"><div class="kv"><span>${t('status')}</span><span>${attBadge(r, s)}</span></div><div class="kv"><span>${t('checkinTime')}</span><span class="ltr">${fmtTime(r.at)}</span></div><div class="kv"><span>${t('method')}</span><span>${t('method.'+r.method)}</span></div>${res.secs!=null?`<div class="kv"><span>${t('ci.duration')}</span><span>${t('secN',{n:res.secs})}</span></div>`:''}</div>` : ''}
  ${!okish ? `<div class="stack-sm" style="margin-top:14px"><button class="btn btn-teal btn-checkin" data-action="ciRetry">${t('ci.tryAgain')}</button><p class="xs muted" style="text-align:center">${t('ci.askTrainer')}</p></div>` : `<details class="explain" style="margin-top:14px"><summary>${t('ci.demoControls')}</summary><div class="row" style="margin-top:8px"><button class="btn btn-sm" data-action="ciScan" data-sid="${s.id}">${t('ci.simDuplicate')}</button></div></details>`}
  <div style="margin-top:12px">${simTag('simCheckin')}</div>`;
}
function doCheckin(sid, code, method){ return Object.assign(doCheckin0(sid, code, method), {sid}); }
function doCheckin0(sid, code, method){
  const s = sess(sid), paid = s ? myPid(s.courseId) : null; if (!s || s.status!=='live') return {res:'closed', sid};
  const rej = reason => { (S.rejected[sid] = S.rejected[sid] || []).push({id:uid('rj'), paid, reason, at:Date.now()}); addLog('checkin_rejected', {course:s.courseId, sid, pid:paid, reason}); };
  const ex = rec(sid, paid); if (ex){ rej('duplicate'); return {res:'duplicate', rec:ex}; }
  if (code === sessCode(s)){
    const status = minutesSinceStart(s) <= S.settings.checkinWindow ? 'present' : 'late';
    const r = (S.attendance[sid] = S.attendance[sid] || {})[paid] = {status, at: Date.now() + (s.clockOffset||0)*60000, method};
    addLog('checkin', {course:s.courseId, sid, pid:paid, status}); return {res:status, rec:r, secs: V.ci.openedAt ? Math.max(1, Math.round((Date.now()-V.ci.openedAt)/1000)) : null};
  }
  for (let v=0; v<(s.codeVer||0); v++) if (sessCode(s, v)===code){ rej('regenerated'); return {res:'regenerated'}; }
  if (S.sessions.some(o=>o.id!==s.id && sessCode(o)===code)){ rej('other_session'); return {res:'other_session'}; }
  rej('invalid_code'); return {res:'invalid'};

    courseParticipants(c.id).forEach(x=>{ const inv = inviteStatus(x);
      if (inv==='failed') out.push({x, c, k:'invite_failed'});

  const res = V.verify.result; let out = '';
  if (res==='nf') out = `<div style="margin-top:16px">${note(t('verifyNotFound'),'bad','ban')}</div>`;
  else if (res){ const ci = certInfo(res.paid); out = `<div class="card card-b" style="margin-top:16px"><div class="row between"><div class="row"><span style="color:var(--ok)">${icon('shield',26)}</span><h2>${t('verifyFound')}</h2></div>${badge('b-ok', t('validDemo'))}</div>
    <dl class="dl" style="margin-top:14px"><dt>${t('participant')}</dt><dd>${LE(ci.p.name)}</dd><dt>${t('program')}</dt><dd>${LE(ci.program.title)}</dd><dt>${t('course')}</dt><dd>${LE(ci.course.title)}</dd><dt>${t('cohort')}</dt><dd>${LE(ci.cohort.name)} · ${esc(cohortRange(ci.cohort.id))}</dd><dt>${t('issuedBy')}</dt><dd>KAUST Academy (${t('demoBranding')})</dd><dt>${t('issuedOnLbl')}</dt><dd>${esc(fmtDateLong(res.r.at))}</dd><dt>${t('verificationCode')}</dt><dd class="ltr" style="text-align:start">${esc(res.r.code)}</dd></dl><div style="margin-top:14px">${note(t('verifyDisclaimer'),'sim')}</div></div>`; }
  const samples = Object.values(S.certs).filter(c=>c.state==='approved').slice(0,3).map(c=>`<button class="btn btn-sm btn-ghost ltr" data-action="verifySample" data-k="${esc(c.code)}">${esc(c.code)}</button>`).join('');
  return {title:t('nav.verify'), html:`<div class="verify-card">${pageHead(t('verifyTitle'), t('verifySub'))}<div class="card card-b"><form data-submit="verifyCode" class="row" style="align-items:flex-end" novalidate><div class="field" style="flex:1;margin:0;min-width:220px"><label for="f-vcode">${t('verificationCode')}</label><input class="input ltr" id="f-vcode" name="vcode" value="${esc(V.verify.code)}" placeholder="DEMO-KA26-XXXX-XXXX" autocomplete="off" spellcheck="false"><span class="err" id="e-vcode"></span></div><button class="btn btn-primary" type="submit">${icon('shield',16)}${t('verify')}</button></form>${samples?`<div class="row xs muted" style="margin-top:10px">${t('tryCodes')} ${samples}</div>`:''}</div>${out}<p class="xs muted" style="margin-top:12px">${t('verifyFoot')}</p></div>`};
};
SUB.verifyCode = form => { const c = form.vcode.value.trim(); if (!c) return formErrors(form, {vcode:t('errRequired')}); V.verify.code = c.toUpperCase(); V.verify.result = findCert(c) || 'nf'; setHash(href('verify',null,{code:V.verify.code}), true); render(); };
ACT.verifySample = el => { V.verify.code = el.dataset.k; V.verify.result = findCert(el.dataset.k) || 'nf'; setHash(href('verify',null,{code:V.verify.code}), true); render(); };

/* =====================================================================
   12. SHARED ACTIONS, EVENT WIRING, TIMERS, INIT
   ===================================================================== */
ACT.toggleNav = () => { V.navOpen = !V.navOpen; render(); if (V.navOpen){ const a = $('.nav a'); a && a.focus(); } };
ACT.closeNav = () => { V.navOpen = false; render(); };
ACT.toggleLang = () => { LANG = LANG==='ar' ? 'en' : 'ar'; UIP.lang = LANG; saveUI(); closeAllModals(); V.ab = null; render(); toast(t('langChanged'), 'info'); };
ACT.toggleNotif = () => { V.notifOpen = !V.notifOpen; if (V.notifOpen){ UIP.seen[me().id] = notifications().map(n=>n.key); saveUI(); } render(); };
ACT.closeModal = () => closeModal();
ACT.confirmOk = () => { const cb = CONFIRM_CB; CONFIRM_CB = null; closeModal(); cb && cb(); };
ACT.resetDemo = () => confirmModal(t('resetDemo'), t('resetConfirm'), t('resetDemo'), ()=>{ closeAllModals(); resetDemo(); render(); toast(t('resetDone')); }, true);
ACT.skip = (el, e) => { e.preventDefault(); $('#main').focus(); };
CHG.switchUser = el => { setUser(el.value); go(DEFAULT_ROUTE[role()]); toast(t('switchedTo',{r:t('role.'+role(),null,true), n:L(me().name)}), 'info'); };
ACT.tab = el => { const g = el.dataset.group, k = el.dataset.tab, R = parseHash();
  if (g==='pw'){ V.pw.tab = k; V.pw.q=''; setHash(href('program', R.id, {tab:k}), true); }
  if (g==='cw'){ V.cw.tab = k; V.ab = null; setHash(href('course', R.id, {tab:k}), true); }
  if (g==='ps') V.ps.tab = k; if (g==='cfg') V.cfg.tab = k; if (g==='cert') V.cert.tab = k;
  render(); const b = $(`#tab-${g}-${k}`); b && b.focus(); };
/* Forms are handled directly (never via native submission): sandboxed preview frames without
   'allow-forms' block submit events entirely, which would silently break every form. */
function runSubmit(f){ const fn = f && SUB[f.dataset.submit]; if (fn) fn(f); }
ACT.submitForm = () => { const m = topModal(); runSubmit(m && m.querySelector('form[data-submit]')); };

/* Print is silently blocked in some embedded previews — tell the presenter what to do. */
function safePrint(){ const t0 = Date.now(); try { window.print(); } catch(e){ toast(t('printBlocked'),'warn'); return; } if (Date.now()-t0 < 60 && inFrame()) toast(t('printBlocked'),'warn'); }
function copyText(text, okMsg){
  const fallback = () => { try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; (topModal()||document.body).appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); toast(ok?okMsg:t('copyFailed'), ok?'ok':'warn'); } catch(e){ toast(t('copyFailed'),'warn'); } };
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(()=>toast(okMsg), fallback); else fallback(); } catch(e){ fallback(); }
}

/* ---------- Event delegation ---------- */
const SELF_NAV = new Set(['openSession']);
document.addEventListener('click', e => {
  const sb = e.target.closest('button[type=submit], input[type=submit], form[data-submit] button:not([type])');
  if (sb && sb.form && sb.form.dataset.submit){ e.preventDefault(); if (!sb.dataset.action){ if (!sb.disabled) runSubmit(sb.form); return; } }
  const el = e.target.closest('[data-action]');
  if (V.notifOpen && !e.target.closest('.notif-panel') && !e.target.closest('[data-action="toggleNotif"]')){ V.notifOpen = false; if (!el && !e.target.closest('a[href^="#/"]')){ render(); return; } }
  const link = e.target.closest('a[href^="#/"]'); if (link) e.preventDefault();
  if (el && !el.disabled && ACT[el.dataset.action]) ACT[el.dataset.action](el, e);
  if (link && !(el && el===link && SELF_NAV.has(el.dataset.action))) goHref(link.getAttribute('href'));
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-submit]'); if (!f) return; e.preventDefault(); runSubmit(f); });
document.addEventListener('keydown', e => {
  if (e.altKey && (e.key==='ArrowLeft' || e.key==='ArrowRight') && !topModal() && !(e.target.matches && e.target.matches('input,textarea,select'))){ const back = (e.key==='ArrowLeft') !== (document.documentElement.dir==='rtl'); if (back && $('.back-btn')){ e.preventDefault(); ACT.navBack(); return; } }
  const m = topModal();
  if (e.key==='Enter' && !e.isComposing && e.target.matches && e.target.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color])') && e.target.form && e.target.form.dataset.submit){ e.preventDefault(); runSubmit(e.target.form); return; }
  if (e.key==='Escape'){ if (m){ e.preventDefault(); closeModal(); return; } if (V.notifOpen){ V.notifOpen = false; render(); return; } if (V.navOpen){ V.navOpen = false; render(); return; } }
  if (e.key==='Tab' && m){ const f = $$('a[href],button:not([disabled]),input:not([disabled]):not(.sr-only),select:not([disabled]),textarea,iframe,video,[tabindex]:not([tabindex="-1"])', m).filter(x=>x.offsetParent!==null);
    if (!f.length) return; const first = f[0], last = f[f.length-1];
    if (e.shiftKey && (document.activeElement===first || !m.contains(document.activeElement))){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement===last || !m.contains(document.activeElement))){ e.preventDefault(); first.focus(); } }
  if ((e.key==='ArrowLeft'||e.key==='ArrowRight') && e.target.getAttribute && e.target.getAttribute('role')==='tab'){
    const list = $$('[role=tab]', e.target.parentElement), i = list.indexOf(e.target), fwd = (e.key==='ArrowRight') !== (document.documentElement.dir==='rtl');
    const nx = list[(i + (fwd?1:-1) + list.length) % list.length]; nx.focus(); nx.click(); }
});
function syncFromLocation(){ if (!HASH_OK) return; try { const h = location.hash || ''; if (h !== ROUTE_H){ if (NAV_STACK.length && NAV_STACK[NAV_STACK.length-1]===h) NAV_STACK.pop(); else if (routeKey(h)!==routeKey(ROUTE_H)) NAV_STACK.push(ROUTE_H); ROUTE_H = h; onRouteChange(); } } catch(e){} }
window.addEventListener('hashchange', syncFromLocation);
window.addEventListener('popstate', syncFromLocation);
// Keep two open windows in sync (e.g., trainer on a projector, participant in another window of the same browser)
window.addEventListener('storage', e => { if (e.key===STORE_KEY && e.newValue){ try { const d = JSON.parse(e.newValue); if (d && d.version===DATA_VERSION){ S = d; if (!topModal() && !V.ab) render(); } } catch(_){} } });

/* ---------- Assessment timer (counts down; auto-submits at zero) ---------- */
setInterval(()=>{ const A = V.attempt; if (!A || A.done) return; const left = Math.max(0, A.limit*60 - Math.floor((Date.now()-A.started)/1000)); const el = $('.js-timer'); if (el){ el.textContent = fmtSecs(left); el.classList.toggle('low', left<60); } if (left<=0) finishRunner(true); }, 1000);

load();
render();
</script>
