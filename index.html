<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>KAUST Academy · Professional Programs (Final demo v3)</title>
<!--
  KAUST Academy — Professional Programs Platform (final demo prototype)
  Ownership model: Academy Admin owns structure; Trainer owns learning content.
  Interactive front-end PROTOTYPE with fictional sample data.
  Single self-contained file: HTML + CSS + vanilla JS. No network, no libraries.
  All integrations (SSO, OTP, geofencing, QR signing, Zoom/Teams, SharePoint,
  email/SMS/WhatsApp, certificate verification) are front-end simulations only.
-->
<style>
/* =====================================================================
   2. DESIGN TOKENS
   ===================================================================== */
:root{
  --navy-950:#071830; --navy-900:#0B2341; --navy-800:#12305A; --navy-700:#1C4170; --navy-200:#C4D1E3; --navy-100:#E4EAF3;
  --teal-700:#0B6B67; --teal-600:#0F7F7A; --teal-500:#15A099; --teal-100:#D4EEEB; --teal-50:#ECF7F6;
  --g-0:#fff; --g-25:#FAFBFC; --g-50:#F4F6F9; --g-100:#ECEFF3; --g-200:#DCE1E8; --g-300:#C5CDD8; --g-400:#97A2B2;
  --g-500:#647084; --g-600:#4F5B6D; --g-700:#3A4556; --g-800:#232D3B; --g-900:#151C27;
  --ok:#17734A; --ok-bg:#E4F3EA; --warn:#8A5300; --warn-bg:#FCF0D6; --bad:#B3261E; --bad-bg:#FCE8E6;
  --info:#1D578F; --info-bg:#E5EEF8; --sim:#4E3F92; --sim-bg:#F1EFFA;
  --c-present:#0F7F7A; --c-late:#D49A2E; --c-absent:#C9D0DA; --c-pre:#9DB2CC; --c-post:#12305A;
  --radius:10px; --shadow-1:0 1px 2px rgba(11,35,65,.05),0 1px 3px rgba(11,35,65,.07); --shadow-2:0 18px 48px rgba(7,24,48,.22);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-ar:"Segoe UI","Noto Sans Arabic","Geeza Pro","Arabic UI Text",Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--g-800);background:var(--g-50)}
html[lang=ar] body{font-family:var(--font-ar);font-size:14.5px}
h1,h2,h3,h4{margin:0;color:var(--navy-900);line-height:1.3}
h1{font-size:21px;font-weight:650;letter-spacing:-.005em}
h2{font-size:15.5px;font-weight:650}
h3{font-size:14px;font-weight:650}
p{margin:0}
a{color:var(--teal-700)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal-500);outline-offset:2px}
@media (max-width:600px){.item-row{flex-wrap:wrap}.item-row .row{flex-wrap:wrap !important}.cls-row .row{flex-wrap:wrap !important}.item-row > .grow{flex:1 1 0;min-width:0}.item-row > .row{flex-basis:100%;justify-content:flex-start !important;padding-inline-start:46px}}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:8px;top:-80px;z-index:200;background:var(--navy-900);color:#fff;padding:8px 14px;border-radius:8px}
.skip:focus{top:8px}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--g-500)} .small{font-size:12.5px} .xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .between{justify-content:space-between} .nowrap{white-space:nowrap}
.stack>*+*{margin-top:16px} .stack-sm>*+*{margin-top:8px}
.flip-rtl{} [dir=rtl] .flip-rtl{transform:scaleX(-1)}

/* =====================================================================
   APPLICATION SHELL
   ===================================================================== */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex:0 0 252px;background:var(--navy-900);color:#D8E1EE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.wm{font-weight:700;font-size:17px;color:#fff;letter-spacing:.01em;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wm b{font-weight:400;color:#9FD9D4}
.brand .sub{font-size:12.5px;color:#AFC0D4;margin-top:2px}
.brand .tag{display:inline-block;margin-top:9px;font-size:10.5px;padding:1px 8px;border:1px solid rgba(255,255,255,.22);border-radius:99px;color:#C4D0E0}
.nav{padding:10px;flex:1}
.nav-label{font-size:11px;letter-spacing:.06em;color:#8195B0;padding:10px 12px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:1px 0;border-radius:8px;color:#D3DDEA;text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current=page]{background:rgba(21,160,153,.17);color:#fff}
.nav a[aria-current=page]::before{content:"";position:absolute;inset-inline-start:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--teal-500)}
.nav a:focus-visible{outline-color:#7FD3CD}
.side-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9AACC3}
.side-foot .btn{width:100%;background:transparent;color:#E3EAF3;border-color:rgba(255,255,255,.25)}
.side-foot .btn:hover{background:rgba(255,255,255,.07)}
.side-foot p{margin-top:10px;line-height:1.45}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--g-200);display:flex;align-items:center;gap:10px;padding:10px 24px;min-height:60px}
.topbar .spacer{flex:1}
.topbar .wm-mobile{display:none;color:var(--navy-900);font-weight:700;font-size:15px}
.pill-demo{font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--warn-bg);color:var(--warn);border:1px solid #EFD49C;font-weight:600;white-space:nowrap}
.role-wrap{display:flex;align-items:center;gap:8px}
.role-wrap label{font-size:12px;color:var(--g-500);white-space:nowrap}
.role-wrap select{max-width:300px;height:36px;border:1px solid var(--g-300);border-radius:8px;padding:0 8px;background:#fff;font-weight:600;color:var(--navy-900)}
.bell{position:relative}
.bell .dot{position:absolute;top:3px;inset-inline-end:3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1}
.notif-panel{position:absolute;top:54px;inset-inline-end:16px;width:min(380px,calc(100vw - 24px));background:#fff;border:1px solid var(--g-200);border-radius:12px;box-shadow:var(--shadow-2);z-index:50}
.notif-panel .list li{padding:10px 14px}
.page{padding:24px;max-width:1320px;width:100%;margin:0 auto;flex:1}
.page:focus{outline:none}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.crumbs{font-size:12.5px;color:var(--g-500);margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--g-600);text-decoration:none} .crumbs a:hover{text-decoration:underline}
.page-sub{color:var(--g-600);margin-top:4px;max-width:78ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.app-foot{padding:14px 24px 22px;font-size:12px;color:var(--g-500);text-align:center}
.btn.menu-btn{display:none}
.scrim{display:none}
.bottom-nav{display:none}

/* =====================================================================
   COMPONENTS
   ===================================================================== */
.card{background:#fff;border:1px solid var(--g-200);border-radius:var(--radius);box-shadow:var(--shadow-1);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid var(--g-100);flex-wrap:wrap}
.card-h .hint{font-size:12px;color:var(--g-500)}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.kpi{padding:14px 16px}
.kpi .k-label{font-size:12.5px;color:var(--g-600);display:flex;gap:7px;align-items:center}
.kpi .k-label svg{color:var(--teal-600)}
.kpi .k-val{font-size:25px;font-weight:650;color:var(--navy-900);margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k-val small{font-size:14px;color:var(--g-500);font-weight:500}
.kpi .k-sub{font-size:12px;color:var(--g-500);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap;line-height:1.7;background:var(--g-100);color:var(--g-700)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85;flex:none}
.badge.nodot::before{display:none}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)} .b-teal{background:var(--teal-50);color:var(--teal-700)} .b-navy{background:var(--navy-100);color:var(--navy-800)}
.b-sim{background:var(--sim-bg);color:var(--sim)}
.b-live{background:var(--ok-bg);color:var(--ok)} .b-live::before{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(23,115,74,.55)}70%{box-shadow:0 0 0 6px rgba(23,115,74,0)}100%{box-shadow:0 0 0 0 rgba(23,115,74,0)}}
.sim-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--sim);background:var(--sim-bg);border:1px dashed #B8AEE0;padding:1px 8px;border-radius:6px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--g-300);background:#fff;color:var(--g-800);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--g-50);border-color:var(--g-400)}
.btn-primary{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.btn-primary:hover{background:var(--navy-800);border-color:var(--navy-800)}
.btn-teal{background:var(--teal-600);border-color:var(--teal-600);color:#fff}
.btn-teal:hover{background:var(--teal-700);border-color:var(--teal-700)}
.btn-danger{color:var(--bad);border-color:#E9BDB8}
.btn-danger:hover{background:var(--bad-bg);border-color:var(--bad)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--g-100);border-color:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn-lg{height:48px;padding:0 22px;font-size:15px;border-radius:10px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;padding:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--g-200);margin-bottom:16px;overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--g-600);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--navy-900)}
.tab[aria-selected=true]{color:var(--navy-900);border-bottom-color:var(--teal-600)}
.table-wrap{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;font-size:12px;font-weight:600;color:var(--g-600);background:var(--g-25);padding:9px 12px;border-bottom:1px solid var(--g-200);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--g-100);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--g-25)}
.tbl .num,.tbl th.num{text-align:end;font-variant-numeric:tabular-nums}
.tbl .center{text-align:center}
.cell-main{font-weight:600;color:var(--navy-900)}
.cell-sub{font-size:12px;color:var(--g-500)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.input,.select{height:36px;border:1px solid var(--g-300);border-radius:8px;padding:0 10px;background:#fff;min-width:0;max-width:100%}
.select{padding-inline-end:6px}
.textarea{border:1px solid var(--g-300);border-radius:8px;padding:8px 10px;min-height:96px;width:100%;resize:vertical;background:#fff}
.input:hover,.select:hover,.textarea:hover{border-color:var(--g-400)}
.input[aria-invalid=true],.select[aria-invalid=true],.textarea[aria-invalid=true]{border-color:var(--bad);background:#FFFBFA}
.search{position:relative;display:inline-flex}
.search svg{position:absolute;inset-inline-start:10px;top:9px;color:var(--g-400);pointer-events:none}
.search .input{padding-inline-start:34px;width:260px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.field>label,.field .lbl{font-weight:600;font-size:13px;color:var(--g-700)}
.field .help{font-size:12px;color:var(--g-500)}
.field .err{font-size:12px;color:var(--bad);font-weight:600;min-height:0}
.field .err:empty{display:none}
.field .input,.field .select{width:100%}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--teal-600)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:13px;line-height:1.5}
.note svg{flex:none;margin-top:2px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.sim{background:var(--sim-bg);color:var(--sim)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;padding:34px 16px;color:var(--g-500)}
.empty svg{color:var(--g-300);margin-bottom:8px}
.empty h3{color:var(--g-700);margin-bottom:4px}
.progress{height:7px;background:var(--g-100);border-radius:99px;overflow:hidden;min-width:60px}
.progress>span{display:block;height:100%;background:var(--teal-600);border-radius:99px}
.meter{display:flex;align-items:center;gap:8px}
.meter .progress{flex:1}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:11px 0;border-bottom:1px solid var(--g-100)}
.list>li:last-child{border-bottom:0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.dl dt{color:var(--g-500)} .dl dd{margin:0;font-weight:600;color:var(--g-800)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--g-600);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{color:var(--g-400)}
.type-ico{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.03em;flex:none;color:#fff}
.t-pdf{background:#B5473A}.t-pptx{background:#C0692B}.t-docx{background:#2F5E9E}.t-xlsx{background:#2D7A4F}.t-video{background:#5A4A9A}.t-link{background:#4F5B6D}
.item-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--g-100)}
.item-row:last-child{border-bottom:0}
.item-row .grow{flex:1;min-width:0}
details.explain{font-size:12.5px;color:var(--g-600);margin-top:10px}
details.explain summary{cursor:pointer;color:var(--teal-700);font-weight:600}
details.explain div{margin-top:6px;line-height:1.55}
.tip{border-bottom:1px dotted var(--g-500);cursor:help}
.divider{height:1px;background:var(--g-100);margin:14px 0}
.day-h{display:flex;align-items:center;gap:10px;font-weight:650;color:var(--navy-900);margin:4px 0 6px}
.day-h .chip{background:var(--navy-900);color:#fff;font-size:11.5px;padding:2px 9px;border-radius:6px}

/* =====================================================================
   CHARTS (HTML/CSS — direction-aware for RTL/LTR)
   ===================================================================== */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--g-600)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
.hbar-row{display:grid;grid-template-columns:minmax(96px,190px) minmax(0,1fr) 58px;gap:12px;align-items:center;margin:10px 0;font-size:13px}
.hbar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g-700)}
.hbar-row .val{text-align:end;font-weight:600;font-variant-numeric:tabular-nums;color:var(--g-800)}
.hbar{height:16px;background:var(--g-100);border-radius:4px;display:flex;overflow:hidden}
.hbar span{height:100%;display:block}
.hbar.thin{height:10px}
.cols{display:flex;align-items:flex-end;gap:12px;height:190px;border-bottom:1px solid var(--g-300);padding:0 4px;background:repeating-linear-gradient(to top,transparent 0,transparent 37px,var(--g-100) 37px,var(--g-100) 38px)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .bar{width:100%;max-width:46px;background:var(--teal-600);border-radius:4px 4px 0 0;min-height:2px}
.col .v{font-size:11.5px;font-weight:600;color:var(--g-700);margin-bottom:4px;font-variant-numeric:tabular-nums}
.col .pair{display:flex;gap:4px;align-items:flex-end;justify-content:center;width:100%;height:calc(100% - 22px)}
.col .pair>div{flex:1;max-width:30px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.col .pair .bar{max-width:none}
.col-labels{display:flex;gap:12px;padding:0 4px}
.col-labels div{flex:1;text-align:center;font-size:11.5px;color:var(--g-600);padding-top:6px;min-width:0;line-height:1.3}
.chart-foot{font-size:11.5px;color:var(--g-500);margin-top:10px}
.dist{display:flex;flex-direction:column;gap:6px}

/* =====================================================================
   MODALS, DRAWER, TOASTS
   ===================================================================== */
.modal-back{position:fixed;inset:0;background:rgba(7,24,48,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .12s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-2);width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;outline:none}
.modal.lg{max-width:860px} .modal.xl{max-width:1100px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 14px 20px;border-bottom:1px solid var(--g-100);gap:12px}
[dir=rtl] .modal-h{padding:14px 20px 14px 18px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--g-100);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal-back.side{justify-content:flex-end;align-items:stretch;padding:0}
.modal.drawer{max-width:430px;max-height:none;height:100%;border-radius:0}
.toasts{position:fixed;bottom:18px;inset-inline-end:18px;z-index:150;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--navy-950);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow-2);display:flex;gap:10px;align-items:flex-start;font-size:13.5px;animation:fade .15s}
.toast.ok svg{color:#7EE0B4} .toast.warn svg{color:#F5C36A} .toast.bad svg{color:#FF9B91}
.toast svg{flex:none;margin-top:2px}

/* =====================================================================
   ATTENDANCE: QR PANEL + PARTICIPANT CHECK-IN
   ===================================================================== */
.qr-panel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--navy-950);color:#fff;border-radius:12px;padding:22px 24px}
.qr-box{background:#fff;padding:12px;border-radius:10px;line-height:0}
.qr-box svg{display:block}
.code-label{font-size:12.5px;color:#A9BBD1;text-transform:uppercase;letter-spacing:.07em}
.code-big{font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:.1em;direction:ltr;unicode-bidi:isolate;line-height:1.15;margin:4px 0 10px}
.cd-track{height:6px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;max-width:340px}

.qr-panel .sim-tag{background:rgba(255,255,255,.08);color:#D6CEFF;border-color:rgba(214,206,255,.4)}
.qr-panel .meta{color:#C9D5E4}

.count-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ct{border:1px solid var(--g-200);border-radius:10px;padding:12px 14px;background:#fff}
.ct .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.ct .l{font-size:12.5px;color:var(--g-600);display:flex;align-items:center;gap:6px}
.ct .l i{width:9px;height:9px;border-radius:50%;display:inline-block}
.present-mode{background:var(--navy-950);color:#fff;text-align:center}
.present-mode .code-big{font-size:clamp(48px,9vw,110px)}
.present-mode .qr-box{display:inline-block}
.ci-wrap{max-width:470px;margin:0 auto}
.ci-card{background:#fff;border:1px solid var(--g-200);border-radius:16px;box-shadow:var(--shadow-1);overflow:hidden}
.ci-top{background:var(--navy-900);color:#fff;padding:18px 18px 16px}
.ci-top h2{color:#fff;font-size:17px;margin-top:6px}
.ci-top .meta{color:#C9D5E4;margin-top:8px}
.ci-top .meta svg{color:#8FA6C2}
.ci-body{padding:18px}
.btn-checkin{width:100%;height:58px;font-size:17px;border-radius:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--g-100);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:600;color:var(--g-600);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy-900);box-shadow:var(--shadow-1)}
.viewfinder{aspect-ratio:1;width:min(250px,70vw);margin:4px auto 14px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#1D3557,#0A1A2E);position:relative;overflow:hidden;display:grid;place-items:center;color:#9FB4CF;font-size:12.5px;text-align:center}
.viewfinder::before{content:"";position:absolute;inset:22px;border:3px solid transparent;border-image:linear-gradient(#5FD3CB,#5FD3CB) 1;clip-path:polygon(0 0,28% 0,28% 4%,4% 4%,4% 28%,0 28%,0 72%,4% 72%,4% 96%,28% 96%,28% 100%,72% 100%,72% 96%,96% 96%,96% 72%,100% 72%,100% 28%,96% 28%,96% 4%,72% 4%,72% 0,100% 0,100% 100%,0 100%)}
.viewfinder .scanline{position:absolute;left:12%;right:12%;height:2px;background:#5FD3CB;box-shadow:0 0 12px #5FD3CB;top:20%;animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{to{top:78%}}
.code-input{font-family:var(--mono);font-size:28px;letter-spacing:.35em;text-align:center;height:58px;width:100%;direction:ltr;border:1.5px solid var(--g-300);border-radius:12px;padding:0 0 0 .35em}
.result{text-align:center;padding:8px 4px 4px}
.result .ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:4px auto 12px}
.result h2{font-size:20px}
.r-ok .ring{background:var(--ok-bg);color:var(--ok)} .r-late .ring{background:var(--warn-bg);color:var(--warn)}
.r-dup .ring{background:var(--info-bg);color:var(--info)} .r-bad .ring{background:var(--bad-bg);color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--g-100);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--g-500)} .kv span:last-child{font-weight:600;text-align:end}

/* =====================================================================
   ASSESSMENTS, RATINGS, ATTENDANCE MATRIX
   ===================================================================== */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.timer{font-family:var(--mono);font-weight:700;direction:ltr;unicode-bidi:isolate;background:var(--navy-100);color:var(--navy-900);padding:3px 10px;border-radius:7px}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.q-text{font-size:16.5px;font-weight:600;color:var(--navy-900);margin:6px 0 14px;line-height:1.5}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--g-200);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--g-400)}
.opt input{margin-top:3px;accent-color:var(--teal-600);width:16px;height:16px;flex:none}
.opt:has(input:checked){border-color:var(--teal-600);background:var(--teal-50)}
.conf{display:flex;gap:8px;flex-wrap:wrap}
.conf label{flex:1;min-width:90px;text-align:center;border:1.5px solid var(--g-200);border-radius:9px;padding:8px;cursor:pointer;font-weight:600;font-size:13px}
.conf input{position:absolute;opacity:0;pointer-events:none}
.conf label:has(input:checked){border-color:var(--navy-800);background:var(--navy-100);color:var(--navy-900)}
.conf label:has(input:focus-visible){outline:3px solid var(--teal-500);outline-offset:2px}
.qprog{height:4px;background:var(--g-100);border-radius:99px;overflow:hidden;margin-bottom:14px}
.qprog span{display:block;height:100%;background:var(--teal-600)}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars label{display:grid;place-items:center;width:44px;height:40px;border:1.5px solid var(--g-200);border-radius:9px;cursor:pointer;font-weight:700;color:var(--g-600)}
.stars input{position:absolute;opacity:0;pointer-events:none}
.stars label:has(input:checked){background:var(--teal-600);border-color:var(--teal-600);color:#fff}
.stars label:has(input:focus-visible){outline:3px solid var(--teal-500);outline-offset:2px}
fieldset{border:0;margin:0 0 14px;padding:0;min-width:0}
legend{font-weight:600;font-size:13px;color:var(--g-700);margin-bottom:6px;padding:0}
.mx td,.mx th{text-align:center;padding:8px 6px}
.mx td:first-child,.mx th:first-child{text-align:start;padding-inline-start:12px;position:sticky;inset-inline-start:0;background:#fff;z-index:1}
.mx th:first-child{background:var(--g-25)}
.mk{display:inline-grid;place-items:center;width:26px;height:24px;border-radius:6px;font-size:11.5px;font-weight:700}
.mk-p{background:var(--ok-bg);color:var(--ok)} .mk-l{background:var(--warn-bg);color:var(--warn)} .mk-m{background:var(--info-bg);color:var(--info)}
.mk-a{background:var(--bad-bg);color:var(--bad)} .mk-n{background:var(--g-100);color:var(--g-400)}

/* =====================================================================
   CERTIFICATE
   ===================================================================== */
.cert{aspect-ratio:1.414/1;background:#fff;position:relative;padding:6% 8%;color:var(--navy-900);text-align:center;display:flex;flex-direction:column;justify-content:center;container-type:inline-size;border:1px solid var(--g-200);overflow:hidden}
.cert::before{content:"";position:absolute;inset:2.2cqi;border:2px solid var(--navy-900);pointer-events:none}
.cert::after{content:"";position:absolute;inset:3cqi;border:.5px solid var(--teal-600);pointer-events:none}
.cert .c-wm{font-size:3.1cqi;font-weight:700;letter-spacing:.02em;direction:ltr}
.cert .c-wm b{font-weight:400;color:var(--teal-700)}
.cert .c-kicker{font-size:1.7cqi;letter-spacing:.18em;text-transform:uppercase;color:var(--g-500);margin-top:1.4cqi}
.cert .c-title{font-size:4.6cqi;font-weight:300;margin-top:2.6cqi;letter-spacing:.01em}
.cert .c-pre{font-size:1.9cqi;color:var(--g-600);margin-top:2.4cqi}
.cert .c-name{font-size:5.2cqi;font-weight:650;margin-top:1cqi;color:var(--navy-950)}
.cert .c-prog{font-size:2.8cqi;font-weight:600;margin-top:1cqi;color:var(--teal-700)}
.cert .c-detail{font-size:1.7cqi;color:var(--g-600);margin-top:1.2cqi}
.cert .c-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4cqi;font-size:1.55cqi;color:var(--g-600);text-align:start;gap:3cqi}
.cert .c-sig{border-top:1px solid var(--g-400);padding-top:.8cqi;min-width:22cqi}
.cert .c-code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;color:var(--navy-900);font-weight:600}
.cert .c-demo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:10cqi;font-weight:800;color:rgba(11,35,65,.05);white-space:nowrap;pointer-events:none;letter-spacing:.1em}
.cert .c-ribbon{position:absolute;top:4.2cqi;inset-inline-end:4.5cqi;font-size:1.4cqi;background:var(--warn-bg);color:var(--warn);padding:.3cqi 1.2cqi;border-radius:99px;font-weight:700}
.verify-card{max-width:620px}


/* =====================================================================
   V2 ADDITIONS: wizard, ownership labels, readiness, builders, templates
   ===================================================================== */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;list-style:none;padding:0}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:10px;border:1px solid var(--g-200);background:#fff;font-size:13px;font-weight:600;color:var(--g-600);cursor:pointer}
[dir=rtl] .step{padding:7px 8px 7px 12px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--g-100);font-size:12px;flex:none}
.step[aria-current=step]{border-color:var(--navy-900);color:var(--navy-900);box-shadow:0 0 0 1px var(--navy-900) inset}
.step[aria-current=step] .n{background:var(--navy-900);color:#fff}
.step.done .n{background:var(--teal-600);color:#fff}
.step:hover{border-color:var(--g-400)}
.owner{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:5px;white-space:nowrap;line-height:1.5}
.own-admin{background:#E6ECF5;color:#1C3B66}.own-trainer{background:#E2F3F1;color:#0B6B67}.own-participant{background:#FFF2D9;color:#7A4D00}.own-coord{background:#F0EDFA;color:#4E3F92}.own-client{background:#EEF1F5;color:#3A4556}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--g-100)}
.checklist li:last-child{border-bottom:0}
.checklist .grow{flex:1;min-width:0}
.ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.ck.ok{background:var(--ok-bg);color:var(--ok)}.ck.no{background:var(--g-100);color:var(--g-500)}.ck.warn{background:var(--warn-bg);color:var(--warn)}.ck.prog{background:var(--info-bg);color:var(--info)}
.readonly{background:var(--g-25);border:1px dashed var(--g-300);border-radius:10px;padding:14px 16px}
.section-label{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.task{border:1px solid var(--g-200);border-radius:12px;background:#fff;padding:14px 16px}
.task h3{font-size:14.5px}
.task-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.task-grid .ti{border:1px solid var(--g-100);border-radius:8px;padding:8px 10px;background:var(--g-25)}
.task-grid .ti .l{font-size:12px;color:var(--g-600)}
.qe{border:1px solid var(--g-200);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.qe-h{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.opt-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;margin-bottom:6px}
.opt-row input[type=radio]{width:17px;height:17px;accent-color:var(--teal-600)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.tpl-stage{position:relative;aspect-ratio:1.414/1;container-type:inline-size;overflow:hidden;border:1px solid var(--g-200);background:#fff;color:var(--navy-900)}
.tpl-stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tpl-default{position:absolute;inset:0;background:linear-gradient(180deg,#fff, #F7F9FB)}
.tpl-default::before{content:"";position:absolute;inset:2.2cqi;border:2px solid var(--navy-900)}
.tpl-default::after{content:"";position:absolute;inset:3cqi;border:.5px solid var(--teal-600)}
.tpl-default .wm2{position:absolute;top:8%;left:0;right:0;text-align:center;font-weight:700;font-size:3cqi;direction:ltr}
.tpl-default .wm2 b{font-weight:400;color:var(--teal-700)}
.tpl-default .kick{position:absolute;top:14.5%;left:0;right:0;text-align:center;font-size:1.5cqi;letter-spacing:.18em;text-transform:uppercase;color:var(--g-500)}
.tpl-default .ttl{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:4.4cqi;font-weight:300}
.tpl-field{position:absolute;transform:translate(-50%,-50%);line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.tpl-field.sel{outline:1.5px dashed var(--teal-500);outline-offset:3px}
.tpl-ribbon{position:absolute;top:3.2cqi;inset-inline-end:3.6cqi;font-size:1.35cqi;background:var(--warn-bg);color:var(--warn);padding:.3cqi 1.2cqi;border-radius:99px;font-weight:700;z-index:2}
.tpl-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-22deg);font-size:9cqi;font-weight:800;color:rgba(11,35,65,.05);white-space:nowrap;pointer-events:none;z-index:1}
.range-row{display:grid;grid-template-columns:92px minmax(0,1fr) 48px;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}
.range-row input[type=range]{width:100%;accent-color:var(--teal-600)}
.file-drop{border:1.5px dashed var(--g-300);border-radius:12px;padding:16px;text-align:center;background:var(--g-25)}
.preview-frame{width:100%;height:min(70vh,640px);border:1px solid var(--g-200);border-radius:8px;background:#fff}
.conflict{color:var(--warn);font-weight:600}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:4px 0 4px;padding-inline-start:18px;border-inline-start:1px dashed var(--g-300)}
.tree li{padding:4px 0}
.cls-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--g-100)}
.cls-row.off .input{color:var(--g-400);text-decoration:line-through}
.count-tiles.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1024px){.count-tiles.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.count-tiles.c5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.task-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.step .lbl{display:none}.step[aria-current=step] .lbl{display:inline}}
@media print{body.printing-cert .tpl-stage{border:0}}

/* =====================================================================
   RESPONSIVE
   ===================================================================== */
@media (max-width:1180px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1024px){
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow-2)}
  [dir=rtl] .sidebar{transform:translateX(102%)}

  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(7,24,48,.42);z-index:55}
  .btn.menu-btn{display:inline-flex}
  .topbar{padding:8px 14px;gap:8px}
  .topbar .wm-mobile{display:inline-block}

}
@media (max-width:820px){
  .g-2,.g-3{grid-template-columns:minmax(0,1fr)}

}

  .search{flex:1 1 100%}

  .role-wrap select{max-width:150px;font-size:13px}
  .hbar-row{grid-template-columns:minmax(80px,110px) minmax(0,1fr) 46px;gap:8px}
  .code-big{font-size:38px}
  .kpi .k-val{font-size:22px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .topbar{padding:8px 10px;gap:6px}
  .topbar .wm-mobile{font-size:13.5px}

}

/* =====================================================================
   PRINT (browser "Save as PDF")
   ===================================================================== */
.print-only{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:11.5px}
  .sidebar,.topbar,.bottom-nav,.no-print,.app-foot,.toasts,.scrim,.notif-panel{display:none!important}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v3: instructor teams, people & access, materials prominence */
.team-list{display:flex;flex-direction:column;gap:2px;border:1px solid var(--g-200);border-radius:10px;padding:6px 10px;max-height:260px;overflow:auto;background:var(--g-25)}

.mat-strip.flat{margin-top:0}
.mat-ico{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--teal-600);color:#fff;flex:none;vertical-align:middle}
.mat-card{border-color:var(--teal-100)}
.ct .badge{white-space:normal;max-width:100%}
.mat-card .card-h h2{display:flex;align-items:center;gap:8px}
.people-list .person{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;padding:12px 18px}

:focus-visible{outline:3px solid var(--teal-500);outline-offset:2px}
@media (max-width:600px){.item-row{flex-wrap:wrap}.item-row .row{flex-wrap:wrap !important}.cls-row .row{flex-wrap:wrap !important}.item-row > .grow{flex:1 1 0;min-width:0}.item-row > .row{flex-basis:100%;justify-content:flex-start !important;padding-inline-start:46px}}

/* v4: participant course hub, sticky section tabs, today indicators, quick check-in */
:root{--tbh:60px}
.tabs{position:sticky;top:var(--tbh);z-index:15;background:var(--g-50);padding-top:4px}
.p-wrap{max-width:1100px;margin:0 auto}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--g-500)}
.next-card{border-inline-start:4px solid var(--teal-600)}
.hub-head{margin-bottom:12px}.hub-head h1{margin:2px 0 4px}
.hub-tabs{position:sticky;top:var(--tbh);z-index:15;background:var(--g-50);margin:0 -4px 16px;padding:6px 4px 0}
.hub-tabs-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--g-200);padding-bottom:8px}
.hub-tabs-in::-webkit-scrollbar{display:none}
.hub-tab{display:inline-flex;align-items:center;gap:7px;flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--g-200);background:#fff;color:var(--g-700);text-decoration:none;font-weight:600;font-size:13.5px;min-height:42px}
.hub-tab:hover{border-color:var(--teal-500);color:var(--teal-700)}
.hub-tab[aria-selected=true]{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.hub-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--g-100);color:var(--g-700);font-size:11.5px;font-weight:700}
.hub-tab[aria-selected=true] .hub-count{background:rgba(255,255,255,.2);color:#fff}
.hub-count.warn{background:var(--warn-bg);color:var(--warn)}
.today-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--teal-500);box-shadow:0 0 0 4px var(--teal-100);margin-inline-end:8px;vertical-align:middle}
.today-card{border-color:var(--teal-100)}
.today-card .card-h h2{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.today-list{margin:0;padding:0}
.today-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--g-100)}
.today-row:last-child{border-bottom:0}
.today-row>.grow,.sched-row>.grow,.todo-row>div:first-child{flex:1 1 auto}
.today-row.is-live{background:linear-gradient(90deg,var(--teal-50),transparent);border-radius:8px;padding-inline:8px}
.today-time{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:14px;color:var(--navy-900);min-width:52px}
.today-time span{font-weight:500;font-size:11.5px;color:var(--g-500)}
.today-banner{background:#fff;border:1px solid var(--teal-100);border-inline-start:4px solid var(--teal-600);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.today-banner.is-live{border-inline-start-color:var(--bad)}
.today-banner-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.today-ci{margin-top:10px}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.course-tile{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--g-200);border-radius:14px;padding:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow-1);transition:border-color .15s,box-shadow .15s,transform .15s;min-height:220px}
.course-tile:hover{border-color:var(--teal-500);box-shadow:0 6px 18px rgba(11,35,65,.10);transform:translateY(-1px)}
.course-tile:focus-visible{outline:3px solid var(--teal-500);outline-offset:2px}
.course-tile.has-today{border-color:var(--teal-500)}
.course-tile h3{margin:2px 0 0;font-size:16px;line-height:1.35}
.tile-top{display:flex;gap:12px;align-items:flex-start}
.tile-ico{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--navy-100);color:var(--navy-800);flex:none}
.tile-tags{min-height:24px}
.tile-meta{line-height:1.7}
.tile-progress .progress{margin-top:4px}
.tile-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--g-600)}
.tile-stats span{display:inline-flex;align-items:center;gap:4px}
.tile-go{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--teal-700);font-size:13.5px}
.day-card.is-today{border-color:var(--teal-500);box-shadow:0 0 0 3px var(--teal-100)}
.day-card.is-past{opacity:.92}
.sched-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--g-100)}
.sched-row:last-child{border-bottom:0}
.sched-row.is-live{background:var(--teal-50);margin:0 -18px;padding-inline:18px}
.sched-time{width:96px;text-align:start}
.todo-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--g-100)}
.todo-row:last-child{border-bottom:0}
@media (max-width:600px){
  .tile-grid{grid-template-columns:minmax(0,1fr)}
  .todo-row,.sched-row{flex-wrap:wrap}.todo-row>.row,.sched-row>.row{width:100%;justify-content:flex-start}
  .sched-time{width:auto}
  .hub-tab{padding:8px 12px;font-size:13px}
}
.back-bar{display:flex;gap:6px;align-items:center;margin:-6px 0 8px;flex-wrap:wrap}
.back-btn{font-weight:600}
.back-ico{transform:scaleX(-1)} html[dir=rtl] .back-ico{transform:none}
</style>

function dateAt(off, hm='00:00'){ const d = day0(); d.setDate(d.getDate()+off); const [h,m] = String(hm).split(':').map(Number); d.setHours(h||0,m||0,0,0); return d; }

}

function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw){ const d = JSON.parse(raw); if (d && COMPAT_VERSIONS.includes(d.version)) S = d; } } catch(e){ STORAGE_OK = false; }
  try { const u = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); if (u && u.userId) UIP = Object.assign(UIP, u); } catch(e){ STORAGE_OK = false; }
  if (!S) S = seed();
  migrate(S);
  if (!S.users.find(u=>u.id===UIP.userId && u.demo)) UIP.userId = 'u_admin';
  LANG = UIP.lang === 'en' ? 'en' : 'ar';

/** Safe, idempotent upgrade of stored data (keeps every existing record).
    v3.1 → v3.2: course.trainerId → course.instructorIds[] (+ leadId); session.instructorIds[];
    program.coordinatorIds[] (KAUST Program Coordinators); user.status. trainerId is kept for compatibility. */
function migrate(D){
  D.courses.forEach(c=>{ if (!Array.isArray(c.instructorIds)) c.instructorIds = c.trainerId ? [c.trainerId] : []; if (c.leadId===undefined || (c.leadId && !c.instructorIds.includes(c.leadId))) c.leadId = c.instructorIds[0] || null; c.trainerId = c.leadId || null; });
  D.sessions.forEach(s=>{ if (!Array.isArray(s.instructorIds)){ const c = D.courses.find(x=>x.id===s.courseId); s.instructorIds = c ? c.instructorIds.slice() : []; } if (s.leadId===undefined) s.leadId = s.instructorIds[0] || null; });
  D.programs.forEach(p=>{ if (!Array.isArray(p.coordinatorIds)){ const o = D.users.find(u=>u.id===p.ownerId); p.coordinatorIds = o && o.role==='coordinator' ? [o.id] : []; } });
  D.users.forEach(u=>{ if (!u.status) u.status = 'active'; });
  D.drafts = D.drafts || {}; D.requests = D.requests || [];
  if (D.version !== DATA_VERSION){ D.log.push({id:'Lmig'+Date.now().toString(36), ts:Date.now(), actor:'system', type:'data_migrate', p:{v:DATA_VERSION}}); D.version = DATA_VERSION; }
}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); localStorage.setItem(UI_KEY, JSON.stringify(UIP)); STORAGE_OK = true; } catch(e){ STORAGE_OK = false; } }
function saveUI(){ try { localStorage.setItem(UI_KEY, JSON.stringify(UIP)); } catch(e){} }
/** On a new calendar day, move stored timestamps so relative schedules stay coherent. */
function shiftToToday(){
  const now0 = day0().getTime(), delta = now0 - S.anchor; if (!delta) return;
  const keys = new Set(['at','ts','startedAt','endedAt','completedAt','started','completed','updatedAt']);
  (function walk(o){ if (!o || typeof o!=='object') return; for (const k of Object.keys(o)){ const v = o[k]; if (keys.has(k) && typeof v==='number') o[k] = v + delta; else if (typeof v==='object') walk(v); } })(S);
  S.anchor = now0;
}

/* ---------- Permissions (front-end simulation only — real RBAC needs a secure backend) ---------- */
function can(action, ctx){
  const u = me(), r = u.role;
  switch(action){
    case 'structure': return r==='admin';                                   // programs, courses, cohorts, days, sessions, rooms, trainer assignment
    case 'content': return r==='trainer' && !!ctx && isCourseInstructor(ctx, u.id); // materials, assessments, activities of an assigned course
    case 'participants': return r==='admin';
    case 'resendInvite': return r==='admin' || r==='coordinator';
    case 'certApprove': return r==='admin' || r==='coordinator';
    case 'certTemplate': return r==='admin';
    case 'runSession': return r==='trainer' && !!ctx && sessionInstructors(sess(ctx)).includes(u.id); // only instructors assigned to THIS session
    case 'attendanceException': return r==='admin' || (r==='coordinator' && !!ctx && canSeeCourse(sess(ctx).courseId)) || (r==='trainer' && !!ctx && sessionInstructors(sess(ctx)).includes(u.id));
    case 'regenCode': return r==='admin';
    case 'requestChange': return r==='coordinator' || (r==='trainer' && (!ctx || isCourseInstructor(ctx, u.id)));
    case 'config': return r==='admin';
    case 'audit': return r==='admin' || r==='coordinator';
    case 'reports': return r!=='participant';
  }
  return false;
}

/* ---------- Lifecycle & readiness ---------- */
const STATUS_ORDER = ['draft','structure','awaiting','ready','in_progress','completed','archived'];
function cohortRun(chid){ const ss = activeSessions(chid); if (!ss.length) return 'none'; if (ss.every(s=>s.status==='ended')) return 'completed'; if (ss.some(s=>s.status!=='scheduled')) return 'in_progress'; return 'not_started'; }
/** Admin-owned setup checks for a course (structure). */
function adminSetup(cid){
  const c = course(cid), ch = courseCohort(cid), ss = ch ? activeSessions(ch.id) : [], ps = ch ? partsOf(ch.id) : [], items = [];
  items.push({k:'trainer', ok: courseInstructors(cid).length>0});
  items.push({k:'schedule', ok: ss.length>0});
  items.push({k:'rooms', ok: ss.length>0 && ss.every(s=>s.roomId)});
  items.push({k:'participants', ok: ps.length>0});
  const pend = ps.filter(x=>['not_sent','failed'].includes(inviteStatus(x))).length;
  items.push({k:'invites', ok: ps.length>0 && pend===0, soft:true, n:pend});
  const unstaffed = ss.filter(s=>s.status==='scheduled' && !sessionInstructors(s).length).length;
  if (courseInstructors(cid).length) items.push({k:'sessionStaff', ok: unstaffed===0, soft:true, n:unstaffed});
  items.push({k:'coordinator', ok: programCoordinators(c.programId).length>0, soft:true});
  const conf = ss.filter(s=>s.status==='scheduled' && conflictsFor(s).length).length;
  items.push({k:'conflicts', ok: conf===0, soft:true, n:conf});
  return {items, complete: items.filter(i=>!i.soft).every(i=>i.ok)};
}
/** Trainer-owned content status for a course: not_started | in_progress | ready. */
function contentStatus(cid){
  const a = type => { const x = curAssessment(cid, type); if (!x) return 'not_started'; if (x.status==='ready') return 'ready'; return (x.questions.length || (type==='post' && x.sameAsPre)) ? 'in_progress' : 'not_started'; };
  const acts = S.activities.filter(x=>x.courseId===cid && x.status!=='archived');
  const mats = S.materials.filter(x=>x.courseId===cid && x.state!=='archived');
  const items = {pre:a('pre'), post:a('post'),
    activities: !acts.length ? 'not_started' : acts.some(x=>x.status==='published') ? 'ready' : 'in_progress',
    materials: !mats.length ? 'not_started' : mats.some(x=>x.state==='available' || x.state==='scheduled') ? 'ready' : 'in_progress'};
  return {items, complete: Object.values(items).every(v=>v==='ready'), done: Object.values(items).filter(v=>v==='ready').length};
}
function courseStatus(cid){
  const c = course(cid); if (c.archived) return 'archived';
  const p = program(c.programId); if (p.archived) return 'archived'; if (p.status==='draft') return 'draft';
  const runs = cohortsOf(cid).map(ch=>cohortRun(ch.id));
  if (runs.includes('in_progress')) return 'in_progress';
  if (runs.length && runs.every(r=>r==='completed')) return 'completed';
  if (!adminSetup(cid).complete) return 'structure';
  if (!contentStatus(cid).complete) return 'awaiting';
  return 'ready';
}
function programStatus(p){
  if (p.archived) return 'archived'; if (p.status==='draft') return 'draft';
  const cs = coursesOf(p.id).map(c=>courseStatus(c.id)); if (!cs.length) return 'structure';
  if (cs.includes('in_progress')) return 'in_progress';
  if (cs.every(s=>s==='completed')) return 'completed';
  if (cs.includes('structure')) return 'structure';
  if (cs.includes('awaiting')) return 'awaiting';
  return 'ready';
}
const cohortStatus = ch => { if (ch.archived) return 'archived'; const r = cohortRun(ch.id); if (r==='completed') return 'completed'; if (r==='in_progress') return 'in_progress'; const cs = courseStatus(ch.courseId); return ['in_progress','completed'].includes(cs) ? (adminSetup(ch.courseId).complete && contentStatus(ch.courseId).complete ? 'ready' : 'awaiting') : cs; };
/** Who owns the next action for a course, and what it is. */
function nextAction(cid){
  const st = courseStatus(cid);
  if (st==='structure' || st==='draft'){ const miss = adminSetup(cid).items.find(i=>!i.ok && !i.soft); return {owner:'admin', key: miss ? 'na.'+miss.k : 'na.finishSetup'}; }
  if (st==='awaiting'){ const ci = contentStatus(cid).items; const k = Object.keys(ci).find(x=>ci[x]!=='ready'); return {owner:'trainer', key:'na.'+k}; }
  if (st==='ready') return {owner:'coord', key:'na.deliver'};
  if (st==='in_progress') return {owner:'trainer', key:'na.runSessions'};
  if (st==='completed') return {owner:'coord', key:'na.certificates'};
  return null;
}

/* ---------- Schedule conflicts (trainer double-booking, room double-booking) ---------- */
const overlap = (a,b) => toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);
function conflictsFor(s){
  if (!s || s.status==='cancelled') return [];
  const off = sOff(s), mine = sessionInstructors(s), out = [];
  S.sessions.forEach(o=>{
    if (o.id===s.id || o.status==='cancelled' || sOff(o)!==off || !overlap(o,s)) return;
    const oc = course(o.courseId), och = cohort(o.cohortId); if (!oc || oc.archived || !och || och.archived || program(oc.programId).archived) return;
    const who = mine.filter(id=>sessionInstructors(o).includes(id)), kinds = []; if (who.length) kinds.push('trainer'); if (s.roomId && s.roomId===o.roomId && !room(s.roomId)?.virtual) kinds.push('room');
    if (kinds.length) out.push({o, kinds, who});
  });
  return out;
}
function allConflicts(){
  const seen = new Set(), list = [];
  S.sessions.filter(s=>s.status==='scheduled' && !cohort(s.cohortId)?.archived && !course(s.courseId)?.archived).forEach(s=>conflictsFor(s).forEach(c=>{ const k = [s.id, c.o.id].sort().join('|'); if (!seen.has(k)){ seen.add(k); list.push({a:s, b:c.o, o:c.o, kinds:c.kinds, who:c.who}); } }));
  return list;
}

const curAssessment = (cid, type) => S.assessments.filter(a=>a.courseId===cid && a.type===type && !a.superseded).sort((a,b)=>b.version-a.version)[0] || null;

/** Matched-pair impact: only participants who completed BOTH pre and post. */
function impactStats(chids){
  const pairs = [], unmatched = [];
  chids.forEach(chid=>{ const ch = cohort(chid); partsOf(chid).forEach(p=>{
    const pre = getAttempt(p.id, ch.courseId, 'pre'), post = getAttempt(p.id, ch.courseId, 'post');
    if (pre && post) pairs.push({p, pre, post, preP:pctOf(pre), postP:pctOf(post)}); else unmatched.push({p, has: pre?'pre':post?'post':'none'});
  }); });
  const n = pairs.length, out = {n, pairs, unmatched, meanPre:null, meanPost:null, raw:null, gClass:null, gInd:null, gUndef:0, dz:null};
  if (!n) return out;
  out.meanPre = avg(pairs.map(x=>x.preP)); out.meanPost = avg(pairs.map(x=>x.postP)); out.raw = out.meanPost - out.meanPre;
  out.gClass = out.meanPre < 100 ? out.raw/(100-out.meanPre) : null;
  pairs.forEach(x=>{ x.gain = x.postP - x.preP; x.g = x.preP < 100 ? x.gain/(100-x.preP) : null; });
  const gs = pairs.filter(x=>x.g!=null).map(x=>x.g); out.gInd = avg(gs); out.gUndef = n - gs.length;
  if (n>=2){ const d = pairs.map(x=>x.gain), m = avg(d), sd = Math.sqrt(d.reduce((a,v)=>a+(v-m)**2,0)/(n-1)); out.dz = sd>0 ? m/sd : null; }
  return out;
}
/** Objective growth: score per objective tag, matched pairs only. */
function objectiveStats(cid, st){

  return c.objectives.map(o=>{ const pre = avg(st.pairs.map(x=>pct(x.pre,o.id)).filter(v=>v!=null)), post = avg(st.pairs.map(x=>pct(x.post,o.id)).filter(v=>v!=null)); return pre==null||post==null ? null : {o, pre, post}; }).filter(Boolean);
}

const heldDays = chid => { const ds = daysOfCohort(chid); return ds.map((d,i)=>({d, n:i+1})).filter(x=>activeSessions(chid).some(s=>s.dayId===x.d.id && s.status!=='scheduled')).map(x=>x.n); };
const evalsOf = (chid, paid) => S.evaluations.filter(e=>e.cohortId===chid && (!paid || e.participantId===paid));
function evalStats(chids){

/* ---------- Modal (focus-trapped, Esc to close) ---------- */
const modals = [];
function openModal({title, body, footer='', size='', onClose, side=false}){
  const id = uid('m'), back = document.createElement('div');
  back.className = 'modal-back' + (side?' side':'');
  back.innerHTML = `<div class="modal ${size}${side?' drawer':''}" role="dialog" aria-modal="true" aria-labelledby="${id}" tabindex="-1"><div class="modal-h"><h2 id="${id}">${title}</h2><button type="button" class="btn btn-ghost icon-btn" data-action="closeModal" aria-label="${esc(t('close'))}">${icon('x')}</button></div><div class="modal-b">${body}</div>${footer?`<div class="modal-f">${footer}</div>`:''}</div>`;
  back.addEventListener('mousedown', e=>{ if (e.target===back) closeModal(); });
  $('#modal-root').appendChild(back);
  modals.push({el:back, opener:document.activeElement, onClose});
  const f = back.querySelector('[data-autofocus]') || back.querySelector('.modal-b input:not([type=hidden]),.modal-b select,.modal-b textarea,.modal-b button') || back.querySelector('.modal');
  setTimeout(()=>f && f.focus(), 10);
  return back;
}
function closeModal(){
  const m = modals.pop(); if (!m) return; m.el.remove(); if (m.onClose) m.onClose();
  if (m.opener && document.contains(m.opener)) m.opener.focus(); else { const mn = $('#main'); mn && mn.focus({preventScroll:true}); }
}
function closeAllModals(){ while (modals.length) closeModal(); }
const topModal = () => modals.length ? modals[modals.length-1].el : null;
function setModal(body, footer){ const m = topModal(); if (!m) return; if (body!=null) m.querySelector('.modal-b').innerHTML = body; const f = m.querySelector('.modal-f'); if (footer!=null){ if (f) f.innerHTML = footer; else m.querySelector('.modal').insertAdjacentHTML('beforeend', `<div class="modal-f">${footer}</div>`); } }

/* =====================================================================
   6. LOCAL FILE STORE — uploaded files stay in THIS browser only.
   IndexedDB is used when available (survives reload on this device);
   otherwise files are kept in memory for the current session only.
   Nothing is uploaded to any server.
   ===================================================================== */
const FILES = (()=>{
  const mem = new Map();              // key -> {blob, url}
  let dbp = null, ok = null;
  function db(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej)=>{
      try { const r = indexedDB.open('kaPPDemo2Files', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files');
        r.onsuccess = () => { ok = true; res(r.result); };
        r.onerror = () => { ok = false; rej(r.error); };
        r.onblocked = () => { ok = false; rej(new Error('blocked')); };
      } catch(e){ ok = false; rej(e); }
    });
    dbp.catch(()=>{ ok = false; });
    return dbp;
  }
  async function put(key, blob){
    mem.set(key, {blob, url:null});
    try { const d = await db(); await new Promise((res, rej)=>{ const tx = d.transaction('files','readwrite'); tx.objectStore('files').put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); return true; }
    catch(e){ return false; }
  }
  async function get(key){
    if (!key) return null; if (mem.has(key)) return mem.get(key).blob;
    try { const d = await db(); const b = await new Promise((res, rej)=>{ const r = d.transaction('files').objectStore('files').get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); if (b) mem.set(key, {blob:b, url:null}); return b; }
    catch(e){ return null; }
  }
  async function url(key){ const b = await get(key); if (!b) return null; const m = mem.get(key); if (!m.url) m.url = URL.createObjectURL(b); return m.url; }
  function clearAll(){ mem.forEach(m=>{ try { m.url && URL.revokeObjectURL(m.url); } catch(e){} }); mem.clear(); db().then(d=>{ try { d.transaction('files','readwrite').objectStore('files').clear(); } catch(e){} }).catch(()=>{}); }
  return {put, get, url, clearAll, probe: () => db().then(()=>true, ()=>false), get available(){ return ok; }};
})();
FILES.probe();

/* =====================================================================
   6b. REAL QR CODE ENCODER (byte mode, error-correction level M, v1–10)
   Produces a standards-compliant, scannable QR image (SVG). Based on the
   public QR specification (ISO/IEC 18004). No external library.
   ===================================================================== */
const QR = (()=>{
  const ECC_M = [-1,10,16,26,18,24,16,18,22,22,26], BLOCKS_M = [-1,1,1,1,2,2,4,4,4,5,5];
  const rawModules = v => { let r = (16*v+128)*v+64; if (v>=2){ const n = Math.floor(v/7)+2; r -= (25*n-10)*n-55; if (v>=7) r -= 36; } return r; };
  const dataCodewords = v => Math.floor(rawModules(v)/8) - ECC_M[v]*BLOCKS_M[v];
  const gmul = (x,y) => { let z = 0; for (let i=7;i>=0;i--){ z = (z<<1) ^ ((z>>>7)*0x11D); z ^= ((y>>>i)&1)*x; } return z & 0xFF; };
  function rsDivisor(deg){ const r = new Array(deg).fill(0); r[deg-1] = 1; let root = 1; for (let i=0;i<deg;i++){ for (let j=0;j<deg;j++){ r[j] = gmul(r[j], root); if (j+1<deg) r[j] ^= r[j+1]; } root = gmul(root, 0x02); } return r; }
  function rsRemainder(data, div){ const r = div.map(()=>0); for (const b of data){ const f = b ^ r.shift(); r.push(0); div.forEach((c,i)=>{ r[i] ^= gmul(c, f); }); } return r; }
  function alignPos(v, size){ if (v===1) return []; const n = Math.floor(v/7)+2, step = Math.ceil((v*4+4)/(n*2-2))*2; const res = [6]; for (let p = size-7; res.length<n; p -= step) res.splice(1,0,p); return res; }
  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1; while (v<=10 && 4+8+bytes.length*8 > dataCodewords(v)*8) v++;
    if (v>10) throw new Error('QR text too long');
    const bits = []; const push = (val, len) => { for (let i=len-1;i>=0;i--) bits.push((val>>>i)&1); };
    push(4,4); push(bytes.length,8); bytes.forEach(b=>push(b,8));
    const cap = dataCodewords(v)*8; push(0, Math.min(4, cap-bits.length)); while (bits.length%8) bits.push(0);
    const data = []; for (let i=0;i<bits.length;i+=8) data.push(parseInt(bits.slice(i,i+8).join(''),2));
    for (let pad=0xEC; data.length < dataCodewords(v); pad ^= 0xEC^0x11) data.push(pad);
    // Error correction + interleaving
    const nb = BLOCKS_M[v], ecl = ECC_M[v], raw = Math.floor(rawModules(v)/8), nShort = nb - raw%nb, shortLen = Math.floor(raw/nb), div = rsDivisor(ecl);
    const blocks = []; for (let i=0, k=0; i<nb; i++){ const dat = data.slice(k, k + shortLen - ecl + (i<nShort?0:1)); k += dat.length; const ec = rsRemainder(dat, div); if (i<nShort) dat.push(0); blocks.push(dat.concat(ec)); }
    const all = []; for (let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if (i !== shortLen-ecl || j>=nShort) all.push(b[i]); });
    // Matrix
    const size = v*4+17, M = [], F = []; for (let y=0;y<size;y++){ M.push(new Array(size).fill(false)); F.push(new Array(size).fill(false)); }
    const setF = (x,y,d) => { M[y][x] = d; F[y][x] = true; };
    for (let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
    const finder = (cx,cy) => { for (let dy=-4;dy<=4;dy++) for (let dx=-4;dx<=4;dx++){ const d = Math.max(Math.abs(dx),Math.abs(dy)), x = cx+dx, y = cy+dy; if (x>=0&&x<size&&y>=0&&y<size) setF(x,y, d!==2 && d!==4); } };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    const ap = alignPos(v, size), na = ap.length;
    for (let i=0;i<na;i++) for (let j=0;j<na;j++){ if ((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0)) continue; for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++) setF(ap[i]+dx, ap[j]+dy, Math.max(Math.abs(dx),Math.abs(dy))!==1); }
    const fmt = mask => { const d = (0<<3)|mask; let r = d; for (let i=0;i<10;i++) r = (r<<1) ^ ((r>>>9)*0x537); const b = ((d<<10)|r) ^ 0x5412, g = i => ((b>>>i)&1)!==0;
      for (let i=0;i<=5;i++) setF(8,i,g(i)); setF(8,7,g(6)); setF(8,8,g(7)); setF(7,8,g(8)); for (let i=9;i<15;i++) setF(14-i,8,g(i));
      for (let i=0;i<8;i++) setF(size-1-i,8,g(i)); for (let i=8;i<15;i++) setF(8,size-15+i,g(i)); setF(8,size-8,true); };
    fmt(0);
    if (v>=7){ let r = v; for (let i=0;i<12;i++) r = (r<<1) ^ ((r>>>11)*0x1F25); const b = (v<<12)|r; for (let i=0;i<18;i++){ const bit = ((b>>>i)&1)!==0, a = size-11+i%3, c = Math.floor(i/3); setF(a,c,bit); setF(c,a,bit); } }
    let i = 0; for (let right=size-1; right>=1; right-=2){ if (right===6) right = 5; for (let vert=0; vert<size; vert++) for (let j=0;j<2;j++){ const x = right-j, up = ((right+1)&2)===0, y = up ? size-1-vert : vert; if (!F[y][x] && i < all.length*8){ M[y][x] = ((all[i>>>3]>>>(7-(i&7)))&1)!==0; i++; } } }
    for (let y=0;y<size;y++) for (let x=0;x<size;x++) if (!F[y][x] && (x+y)%2===0) M[y][x] = !M[y][x];   // mask pattern 0
    fmt(0);
    return {size, M};
  }
  function svg(text, px=220, label=''){
    const {size, M} = encode(text), q = 4, n = size+q*2; let d = '';
    for (let y=0;y<size;y++) for (let x=0;x<size;x++) if (M[y][x]) d += `M${x+q} ${y+q}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" width="${px}" height="${px}" role="img" aria-label="${esc(label)}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#071830"/></svg>`;
  }
  return {encode, svg};
})();

/* =====================================================================
   6c. MINIMAL .XLSX READER (first worksheet → rows of text)
   Uses the browser's built-in DecompressionStream; no library.
   ===================================================================== */
async function readXlsx(file){
  if (typeof DecompressionStream === 'undefined') throw new Error('nodecomp');
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let eocd = -1; for (let i=buf.length-22; i>=Math.max(0, buf.length-66000); i--) if (dv.getUint32(i,true)===0x06054b50){ eocd = i; break; }
  if (eocd<0) throw new Error('notzip');
  const count = dv.getUint16(eocd+10,true); let p = dv.getUint32(eocd+16,true); const entries = {};
  for (let k=0;k<count;k++){ const method = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true), nlen = dv.getUint16(p+28,true), elen = dv.getUint16(p+30,true), clen = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    const name = new TextDecoder().decode(buf.subarray(p+46, p+46+nlen)); entries[name] = {method, csize, off}; p += 46+nlen+elen+clen; }
  const read = async name => { const e = entries[name]; if (!e) return null; const lnl = dv.getUint16(e.off+26,true), lel = dv.getUint16(e.off+28,true), start = e.off+30+lnl+lel, raw = buf.subarray(start, start+e.csize);
    if (e.method===0) return new TextDecoder().decode(raw);
    const ds = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return await new Response(ds).text(); };
  const parse = s => new DOMParser().parseFromString(s, 'application/xml');
  const shared = []; const ss = await read('xl/sharedStrings.xml'); if (ss) parse(ss).querySelectorAll('si').forEach(si=>shared.push(Array.from(si.querySelectorAll('t')).map(x=>x.textContent).join('')));
  let sheetPath = 'xl/worksheets/sheet1.xml';
  const wb = await read('xl/workbook.xml'), rels = await read('xl/_rels/workbook.xml.rels');
  if (wb && rels){ const first = parse(wb).querySelector('sheet'); const rid = first && (first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    const rel = rid && Array.from(parse(rels).querySelectorAll('Relationship')).find(r=>r.getAttribute('Id')===rid); if (rel){ const tgt = rel.getAttribute('Target'); sheetPath = tgt.startsWith('/') ? tgt.slice(1) : 'xl/'+tgt.replace(/^\.\//,''); } }
  const sx = await read(sheetPath); if (!sx) throw new Error('nosheet');
  const colIdx = ref => { const m = /^([A-Z]+)/.exec(ref||''); let n = 0; if (m) for (const ch of m[1]) n = n*26 + ch.charCodeAt(0)-64; return n-1; };
  const rows = [];
  parse(sx).querySelectorAll('sheetData > row').forEach(r=>{ const row = []; r.querySelectorAll('c').forEach(c=>{ const t = c.getAttribute('t'), vEl = c.querySelector('v'); let val = '';
      if (t==='s') val = shared[Number(vEl?.textContent)] ?? ''; else if (t==='inlineStr') val = Array.from(c.querySelectorAll('is t')).map(x=>x.textContent).join(''); else val = vEl ? vEl.textContent : '';
      row[colIdx(c.getAttribute('r'))] = String(val).trim(); });
    for (let i=0;i<row.length;i++) if (row[i]===undefined) row[i] = ''; if (row.some(x=>x)) rows.push(row); });
  return rows;
}

/* In-memory router; mirrors the address-bar hash only where the browser allows it
   (sandboxed/srcdoc preview frames block history changes). */
const HASH_OK = (()=>{ try { const u = String(location.href); if (u==='about:srcdoc' || location.protocol==='about:' || location.protocol==='data:') return false; history.replaceState(history.state, '', location.href); return true; } catch(e){ return false; } })();
let ROUTE_H = (()=>{ try { return HASH_OK ? (location.hash || '') : ''; } catch(e){ return ''; } })();
function setHash(h, replace){ ROUTE_H = h; if (!HASH_OK) return; try { if (replace) history.replaceState(null, '', h); else if (location.hash !== h) history.pushState(null, '', h); } catch(e){} }
function onRouteChange(){ V.navOpen = false; V.notifOpen = false; render(); const mn = $('#main'); mn && mn.focus({preventScroll:true}); try { window.scrollTo(0,0); } catch(e){} }
/* In-app history for the Back button (works even where the browser blocks history, e.g. sandboxed previews). */
let NAV_STACK = [];
const routeKey = h => { const x = String(h||'').replace(/^#\/?/, '').split('?')[0]; return x || ''; };
function goHref(h){ if (h === ROUTE_H){ render(); return; }
  if (routeKey(h) !== routeKey(ROUTE_H)){ NAV_STACK.push(ROUTE_H || '#/'+DEFAULT_ROUTE[role()]); if (NAV_STACK.length > 50) NAV_STACK.shift(); } // tab/filter changes on the same page don't add a step
  setHash(h); onRouteChange(); }
/** Logical parent page, used when there is no earlier page to return to. */
function parentHref(R){
  const r = role(), n = R.name, id = R.id;
  if (n==='course'){ const c = course(id); if (r==='admin' && c) return href('program', c.programId); return r==='trainer' ? '#/mycourses' : r==='client' ? '#/courses' : r==='coordinator' ? '#/sessions' : '#/home'; }
  if (n==='attendance'){ const s = sess(id); return r==='admin' && s ? href('course', s.courseId, {tab:'schedule'}) : '#/sessions'; }
  if (n==='program' || n==='setup') return '#/programs';
  if (n==='mycourse' && id) return '#/mycourse';
  if (n==='config' && id) return '#/config';
  if (['people','requests','schedule','audit'].includes(n)) return '#/config';
  return '#/'+DEFAULT_ROUTE[r];
}
ACT.navBack = () => { let h = NAV_STACK.pop(); while (h && routeKey(h)===routeKey(ROUTE_H)) h = NAV_STACK.pop(); if (!h) h = parentHref(parseHash()); setHash(h); onRouteChange(); };

  const R = parseHash(), isHome = (route===DEFAULT_ROUTE[role()] && !R.id) || (role()==='participant' && inviteStatus(part(me().participantId))!=='completed');

}
function parseHash(){ const h = ROUTE_H.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const parts = (path||'').split('/').filter(Boolean); return {name: parts[0]||'', id: parts[1] ? decodeURIComponent(parts[1]) : null, q: Object.fromEntries(new URLSearchParams(qs||''))}; }

function notifications(){
  const u = me(), r = u.role, list = [];
  const add = (key, txt, link, ts0) => list.push({key, txt, link, ts:ts0||Date.now()});
  if (r==='admin') attentionItems().slice(0,8).forEach(a=>add(a.key, a.text, a.link));
  if (r==='trainer'){
    visibleCourses().filter(c=>!contentStatus(c.id).complete).forEach(c=>add('as'+c.id, t('nt.assigned',{c:L(c.title)}), href('course',c.id)));
    S.sessions.filter(s=>sessionInstructors(s).includes(u.id) && liveCourse(s.courseId) && sOff(s)===0 && s.status!=='cancelled').forEach(s=>add('ss'+s.id, t('nt.sessionToday',{s:L(s.title), t:s.start}), href('attendance',s.id)));
  }
  if (r==='coordinator'){
    S.sessions.filter(s=>sOff(s)===0 && s.status!=='cancelled' && liveCourse(s.courseId) && canSeeCourse(s.courseId)).forEach(s=>add('ss'+s.id, t('nt.sessionToday',{s:L(s.title), t:s.start}), href('attendance',s.id)));
    needsHelp().slice(0,4).forEach(h=>add('hp'+h.x.id+h.k, `${esc(L(h.x.name))} — ${t('help.'+h.k)}`, href('home')));
  }
  if (r==='participant') myEnrollments().forEach(pa=>{ const ch = cohort(pa.cohortId);
    activeSessions(ch.id).filter(s=>s.status==='live' && !rec(s.id, pa.id)).forEach(s=>add('lv'+s.id, t('nt.liveNow',{s:L(s.title)}), href('checkin')));
    activeSessions(ch.id).filter(s=>s.status==='scheduled' && sOff(s)>=0 && sOff(s)<=1).forEach(s=>add('up'+s.id, t('nt.upcoming',{s:L(s.title), d:dayLabel(sOff(s)), t:s.start}), href('mycourse', pa.id, {tab:'schedule'})));
    materialsFor(ch.id).filter(m=>matState(m)==='available' && (m.updatedAt||0) > Date.now()-3*86400000).forEach(m=>add('mt'+m.id, t('nt.material',{m:L(m.title)}), href('mycourse', pa.id, {tab:'materials'}), m.updatedAt));
    activitiesFor(ch.id, true).filter(a=>['pending','progress'].includes(subState(a,pa.id)) && a.dueOffset<=1).forEach(a=>add('ad'+a.id, t('nt.due',{a:L(a.title), d:dayLabel(a.dueOffset)}), href('mycourse', pa.id, {tab:'todo'}), ts(a.dueOffset,'08:00'))); });

  if (r==='client') S.sessions.filter(s=>sOff(s)>=0 && sOff(s)<=7 && s.status==='scheduled' && visibleCourses().some(c=>c.id===s.courseId)).slice(0,4).forEach(s=>add('cu'+s.id, t('nt.upcoming',{s:L(s.title), d:dayLabel(sOff(s)), t:s.start}), href('course',s.courseId)));
  return list.sort((a,b)=>b.ts-a.ts);
}

function captureFocus(){
  const a = document.activeElement; if (!a || a===document.body) return null;
  if (a.id) return '#'+CSS.escape(a.id);
  if (a.dataset && a.dataset.action){ let s = `[data-action="${a.dataset.action}"]`; ['id','tab','sid','pid','mid','aid','k','cid','qid'].forEach(k=>{ if (a.dataset[k]) s += `[data-${k}="${CSS.escape(a.dataset[k])}"]`; }); return s; }
  return null;
}
function render(){
  const R = parseHash(), r = role(), allowed = allowedRoutes(r);
  let name = R.name; if (!name){ name = DEFAULT_ROUTE[r]; setHash('#/'+name, true); R.name = name; }
  if (me().status==='deactivated'){ document.documentElement.lang = LANG; document.documentElement.dir = LANG==='ar' ? 'rtl' : 'ltr'; $('#app').innerHTML = shell({html: pageHead(t('accessOffTitle')) + card('', empty(t('accessOffTitle'), t('accessOffMsg'), 'lock'))}, name); return; }
  if (r==='participant' && inviteStatus(part(me().participantId))!=='completed' && !['activate','verify'].includes(name)){ name = 'activate'; setHash('#/activate', true); }
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==='ar' ? 'rtl' : 'ltr';
  const fk = captureFocus(); let screen;
  try { screen = allowed.includes(name) && SCREENS[name] ? SCREENS[name](R) : notAllowed(name); }
  catch(err){ console.error(err); screen = {title:t('error'), html: card('', empty(t('error'), esc(err.message), 'alert'))}; }
  document.title = `${screen.title} · KAUST Academy — ${t('appName')} (${t('demoPillShort')})`;
  $('#app').innerHTML = shell(screen, name);
  if (fk){ const el = $(fk); if (el) el.focus({preventScroll:true}); }
  const tb = $('.topbar'); if (tb) document.documentElement.style.setProperty('--tbh', tb.offsetHeight+'px');
  if (screen.after) screen.after();
}
function notAllowed(name){
  const known = !!SCREENS[name];
  return {title:t('notAvailable'), html: pageHead(t('notAvailable')) + card('', empty(t('notAvailable'), known ? t('notAvailableRole') : t('notFound'), 'lock', `<a class="btn btn-primary" href="#/${DEFAULT_ROUTE[role()]}">${t('goHome')}</a>`))};
}

/** Short list of things that need the Admin's attention (with a direct fix link). */
function attentionItems(){
  const out = [], add = (key, text, link, owner='admin') => out.push({key, text, link, owner});
  S.programs.filter(p=>p.status==='draft' && !p.archived).forEach(p=>add('dr'+p.id, t('att.draft',{p:L(p.title)||t('untitled',null,true)}), href('setup',p.id,{step:p.setupStep||1})));
  S.courses.filter(c=>liveCourse(c.id) || (!c.archived && program(c.programId).status==='draft')).forEach(c=>{ const su = adminSetup(c.id), p = program(c.programId);
    if (!courseInstructors(c.id).length) add('tr'+c.id, t('att.noTrainer',{c:L(c.title)}), href('setup',p.id,{step:2}));
    else if (!su.items.find(i=>i.k==='schedule').ok) add('sc'+c.id, t('att.noSchedule',{c:L(c.title)}), href('setup',p.id,{step:3, course:c.id}));
    else if (!su.items.find(i=>i.k==='participants').ok) add('pa'+c.id, t('att.noParticipants',{c:L(c.title)}), href('course',c.id,{tab:'participants'}));
    const ps = courseParticipants(c.id), failed = ps.filter(x=>inviteStatus(x)==='failed').length, notSent = ps.filter(x=>inviteStatus(x)==='not_sent').length;
    if (failed) add('if'+c.id, t('att.failed',{n:failed, c:L(c.title)}), href('course',c.id,{tab:'participants'}));
    if (notSent) add('ns'+c.id, t('att.unsent',{n:notSent, c:L(c.title)}), href('course',c.id,{tab:'participants'})); });
  S.programs.filter(p=>p.status!=='draft' && !p.archived && !programCoordinators(p.id).length).forEach(p=>add('pc'+p.id, t('att.noCoord',{p:L(p.title)}), href('program',p.id)));
  const cf = allConflicts().length; if (cf) add('cf', t('att.conflicts',{n:cf}), href('schedule'));
  S.requests.filter(q=>q.status==='open').forEach(q=>add('rq'+q.id, t('att.request',{n:nameOf(q.from), c:L(course(q.courseId).title)}), href('requests')));
  return out;
}

  return {title:L(p.title), html: pageHead(LE(p.title), `${LE(client(p.clientId)?.name)} · ${esc(programRange(p))}${p.desc&&L(p.desc)?' · '+LE(p.desc):''}`, `<a class="btn" href="${href('setup',p.id,{step:1})}">${icon('edit',16)}${t('editProgramDetails')}</a><button class="btn btn-primary" data-action="editCourse" data-pid="${p.id}">${icon('plus',16)}${t('addCourse')}</button>`, [[t('nav.programs'),'#/programs'],[LE(p.title)]])

/* Client modal — used inline from the program form (keeps the form intact) and from the Clients page. */
ACT.addClient = el => clientModal(null, el.dataset.ctx || '');
ACT.editClient = el => clientModal(client(el.dataset.k), '');
function clientModal(c, ctx){
  openModal({title: c ? t('editClient') : t('addNewClient'), body:`<form data-submit="saveClient" data-k="${c?c.id:''}" data-ctx="${ctx}" novalidate>
    ${field('cname', t('clientOrgName')+' *', inp('cname', c?L(c.name):'', 'text', 'autocomplete="organization"'))}
    <div id="dupBox"></div>
    <details class="explain" ${c?'open':''}><summary>${t('optionalContact')}</summary><div style="margin-top:10px">
    ${field('ccontact', t('contactName'), inp('ccontact', c?.contactName||''))}${field('cemail', t('email'), inp('cemail', c?.contactEmail||'', 'email','dir="ltr"'))}${field('cphone', t('phone'), inp('cphone', c?.contactPhone||'', 'tel','dir="ltr"'))}</div></details></form>`,
    footer:`<button class="btn" data-action="closeModal">${t('cancel')}</button><button class="btn btn-primary" data-action="submitForm">${c?t('save'):t('saveClient')}</button>`});

SUB.saveClient = form => {
  const f = Object.fromEntries(new FormData(form)), name = f.cname.trim(), errs = {}, c = form.dataset.k ? client(form.dataset.k) : null;
  if (name.length < 2) errs.cname = t('errClientName'); if (f.cemail && !validEmail(f.cemail.trim())) errs.cemail = t('errEmail'); if (!formErrors(form, errs)) return;
  const nn = normName(name), similar = v => { const m = normName(v); return m && nn && (m===nn || (Math.min(m.length, nn.length)>=5 && (m.includes(nn) || nn.includes(m)))); };
  const dup = S.clients.find(x=>x!==c && (similar(x.name.en) || similar(x.name.ar)));
  if (dup && form.dataset.force!=='1'){ $('#dupBox').innerHTML = note(`${t('dupClient',{n:L(dup.name)})}<div class="row" style="margin-top:8px"><button type="button" class="btn btn-sm btn-primary" data-action="useExistingClient" data-k="${dup.id}" data-ctx="${form.dataset.ctx}">${t('useExisting')}</button><button type="button" class="btn btn-sm" data-action="forceSave">${t('createAnyway')}</button></div>`, 'warn', 'alert'); return; }
  let rec = c; if (!rec){ rec = {id:'c'+uid('').slice(-6), createdAt:Date.now()}; S.clients.push(rec); }
  Object.assign(rec, {name: c ? Object.assign({}, c.name, {[LANG]:name}) : bi(name), contactName:(f.ccontact||'').trim(), contactEmail:(f.cemail||'').trim(), contactPhone:(f.cphone||'').trim()});
  addLog(c?'client_update':'client_create', {client:rec.id}); save();
  if (c){ closeModal(); render(); return toast(t('saved')); }
  pickClientInForm(rec.id, form.dataset.ctx);
  // Second step: invite a Client Coordinator now, or skip
  setModal(`<div class="result r-ok" style="padding-top:0"><div class="ring">${icon('checkCircle',32)}</div><h2>${t('clientCreated',{n:name})}</h2><p class="small muted">${form.dataset.ctx==='wz'?t('clientSelectedNote'):''}</p></div>
    <form data-submit="inviteCoordFromClient" data-k="${rec.id}" novalidate><h3 style="margin:8px 0">${t('inviteCoordNow')}</h3><p class="small muted" style="margin-bottom:10px">${t('inviteCoordHelp')}</p>
    ${field('uname', t('name'), inp('uname', rec.contactName||''))}${field('uemail', t('email'), inp('uemail', rec.contactEmail||'', 'email','dir="ltr"'))}${simTag('simInvite')}</form>`,
    `<button class="btn" data-action="closeModal">${t('skipLater')}</button><button class="btn btn-primary" data-action="submitForm">${t('sendInvite')}</button>`);
  toast(t('clientCreatedToast',{n:name}));
};
/** Put a client into the open program form's select without re-rendering (keeps typed input). */
function pickClientInForm(id, ctx){
  if (ctx!=='wz'){ if (parseHash().name==='clients') render(); return; }
  const sel = $('#f-client'); if (!sel) return;
  if (!sel.querySelector(`option[value="${id}"]`)) sel.insertAdjacentHTML('beforeend', opt(id, LE(client(id).name), id));
  sel.value = id; sel.dispatchEvent(new Event('change', {bubbles:true}));
}
ACT.useExistingClient = el => { pickClientInForm(el.dataset.k, el.dataset.ctx); closeModal(); toast(t('existingSelected')); };
SUB.inviteCoordFromClient = form => inviteClientCoord(form, form.dataset.k);
